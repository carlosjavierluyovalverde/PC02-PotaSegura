name: PotaSegura DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "test", "feat/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: "1. Build & Dependency Lock (NPM ci)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Deterministic Install (npm ci)
        run: npm ci

      - name: Verify Application Build & Static Modules
        run: npm run build

  test:
    name: "2. Automated Sanitary Unit Tests (Pytest)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Runner (Pytest)
        run: python -m pip install --upgrade pip pytest

      - name: Execute Cold-Chain, 6h Window & HMAC Unit Tests
        run: pytest -v tests/

  security:
    name: "3. Shift-Left Security (SAST Bandit + SCA + Secret Scan)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js for SCA
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Software Composition Analysis (npm audit)
        run: npm audit --audit-level=high

      - name: Setup Python for SAST
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SAST Analyzer (Bandit)
        run: python -m pip install bandit

      - name: Run Static Application Security Testing (Bandit SAST)
        run: bandit -r src/

      - name: Run Gitleaks Secret Scanning
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: "4. Continuous Deployment to Cloudflare Pages & D1"
    runs-on: ubuntu-latest
    needs: [build, test, security]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Validated Release Artifact
        uses: actions/checkout@v4

      - name: Deploy or Verify Cloudflare Pages Production Endpoint
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f25fe3e43884d161b96457f1860abba7"
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler pages deploy public --project-name=potasegura --branch=main
          else
            echo "Verificando disponibilidad del despliegue productivo en Cloudflare Edge (https://potasegura.pages.dev)..."
            curl -sSf -I https://potasegura.pages.dev | head -n 5
            echo "Cloudflare Pages Edge Endpoint Verified Successfully."
          fi
